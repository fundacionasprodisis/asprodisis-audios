<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Carta de derechos y deberes — Niños y niñas</title><style>:root{font-family:Arial,Helvetica,sans-serif;color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f6f7;color:#1f2937;padding:24px}main{width:min(680px,100%);background:white;border-radius:22px;padding:34px 26px;box-shadow:0 10px 35px rgba(0,0,0,.10);text-align:center}.brand{font-size:1rem;letter-spacing:.03em;margin-bottom:28px}h1{font-size:clamp(1.8rem,6vw,2.6rem);margin:0 0 10px;line-height:1.1}h2{font-size:clamp(1.25rem,4vw,1.65rem);font-weight:500;margin:0 0 30px}audio{width:100%;margin:6px 0 22px}button{width:100%;min-height:72px;border:0;border-radius:16px;font-size:1.35rem;font-weight:700;cursor:pointer}.note{margin-top:20px;font-size:.95rem;opacity:.72;line-height:1.45}</style></head><body><main><div class="brand">FUNDACIÓN ASPRODISIS</div><h1>Carta de derechos y deberes</h1><h2>Niños y niñas</h2><audio id="audio" controls preload="metadata" autoplay><source src="ninos-espanol.mp3" type="audio/mpeg"></audio><button id="play">Escuchar ▶</button><p class="note" id="note">Si el audio no comienza automáticamente, pulsa el botón.</p></main><script>const a=document.getElementById('audio'),b=document.getElementById('play');b.onclick=async()=>{try{if(a.paused){await a.play();b.textContent='❚❚'}else{a.pause();b.textContent='Escuchar ▶'}}catch(e){}};a.onplay=()=>b.textContent='❚❚';a.onpause=()=>b.textContent='Escuchar ▶';</script></body></html>
