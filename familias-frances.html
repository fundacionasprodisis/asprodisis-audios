<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Charte des droits et des devoirs — Familles</title>
<style>
:root{
 --coral:#f6a8a4; --coral-dark:#e58f8b; --gray:#9a9fa5; --gray-light:#bcc0c3;
 --ink:#555b61; --paper:#f7f7f7; --white:#ffffff;
}
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;
 font-family:"Avenir Next","Trebuchet MS",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 background:
   radial-gradient(circle at 15% 10%,rgba(246,168,164,.22),transparent 34%),
   radial-gradient(circle at 88% 86%,rgba(188,192,195,.25),transparent 32%),
   var(--paper);
 color:var(--ink)
}
.card{
 width:min(720px,100%);background:rgba(255,255,255,.97);
 border:1px solid rgba(154,159,165,.18);border-radius:30px;padding:30px;
 box-shadow:0 22px 60px rgba(89,95,101,.13);text-align:center;overflow:hidden;position:relative
}
.card:before{
 content:"";position:absolute;left:0;right:0;top:0;height:8px;
 background:linear-gradient(90deg,var(--coral),var(--gray-light),var(--gray))
}
.logo{display:block;width:min(290px,72%);height:auto;margin:8px auto 22px;border-radius:8px}
.logo-fallback{display:none;font-size:1.45rem;font-weight:800;color:var(--coral-dark);margin:10px 0 22px}
.badge{
 display:inline-flex;align-items:center;gap:8px;padding:8px 13px;border-radius:999px;
 background:rgba(246,168,164,.17);color:#8b6664;font-size:.78rem;font-weight:800;letter-spacing:.12em
}
.badge:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--coral)}
h1{margin:18px 0 8px;font-size:clamp(2rem,6vw,3.05rem);line-height:1.08;letter-spacing:-.025em;color:#666b70}
h2{margin:0 0 26px;font-size:clamp(1.2rem,4vw,1.55rem);font-weight:600;color:var(--gray)}
.player{background:#fbf8f8;border:1px solid rgba(246,168,164,.32);border-radius:22px;padding:20px}
audio{width:100%;display:block;margin-bottom:16px}
button{
 width:100%;min-height:72px;border:0;border-radius:18px;background:var(--coral);color:#fff;
 font-size:1.24rem;font-weight:800;cursor:pointer;box-shadow:0 9px 22px rgba(229,143,139,.28);
 transition:transform .15s ease,background .15s ease
}
button:hover{background:var(--coral-dark)}
button:active{transform:translateY(1px)}
.note{margin:18px 6px 0;color:#858a8f;font-size:.95rem;line-height:1.5}
.home{display:inline-block;margin-top:24px;color:#858a8f;text-decoration:none;font-weight:700;font-size:.92rem}
.home:hover{color:var(--coral-dark)}
@media(max-width:560px){.card{padding:25px 18px;border-radius:24px}.player{padding:15px}.logo{width:min(250px,80%)}}
</style>
</head>
<body>
<main class="card">
<img class="logo" src="logo-icara.jpg" alt="Centro Ícara — Fundación ASPRODISIS" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
<div class="logo-fallback">Centro Ícara · Fundación ASPRODISIS</div>
<div class="badge">FRANÇAIS</div>
<h1>Charte des droits et des devoirs</h1>
<h2>Familles</h2>
<div class="player">
<audio id="audio" controls preload="metadata" autoplay><source src="familias-frances.mp3" type="audio/mpeg"></audio>
<button id="play">Écouter ▶</button>
</div>
<p class="note">Si l’audio ne démarre pas automatiquement, appuyez sur le bouton.</p>
<a class="home" href="index.html">← Centro Ícara</a>
</main>
<script>
const a=document.getElementById('audio'),b=document.getElementById('play'),label="Écouter";
b.onclick=async()=>{try{if(a.paused){await a.play();b.textContent='❚❚'}else{a.pause();b.textContent=label+' ▶'}}catch(e){}};
a.onplay=()=>b.textContent='❚❚';
a.onpause=()=>b.textContent=label+' ▶';
</script>
</body></html>
