<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Charte des droits et des devoirs — Enfants</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(160deg,#f8fbfd 0%,#e9f2f7 100%);color:#18324a}
.card{width:min(700px,100%);background:rgba(255,255,255,.96);border:1px solid rgba(50,83,105,.12);border-radius:28px;padding:34px;box-shadow:0 24px 70px rgba(37,68,91,.14);text-align:center}
.brand{font-size:.84rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#4d7390;margin-bottom:16px}
.badge{display:inline-block;padding:7px 11px;border-radius:999px;background:#edf4f8;color:#466b86;font-size:.78rem;font-weight:800;letter-spacing:.12em;margin-bottom:20px}
h1{margin:0;font-size:clamp(2rem,6vw,3.15rem);line-height:1.08;letter-spacing:-.025em}
h2{margin:12px 0 26px;font-size:clamp(1.2rem,4vw,1.55rem);font-weight:600;color:#587086}
.player{background:#f4f8fb;border:1px solid #e2edf3;border-radius:20px;padding:20px}
audio{width:100%;display:block;margin-bottom:16px}
button{width:100%;min-height:70px;border:0;border-radius:16px;background:#234f6d;color:#fff;font-size:1.22rem;font-weight:800;cursor:pointer;box-shadow:0 8px 20px rgba(35,79,109,.18)}
button:active{transform:translateY(1px)}
.note{margin:18px 4px 0;color:#718392;font-size:.95rem;line-height:1.5}
.home{display:inline-block;margin-top:24px;color:#5b768a;text-decoration:none;font-weight:700;font-size:.92rem}
@media(max-width:560px){.card{padding:26px 20px;border-radius:22px}.player{padding:16px}}
</style>
</head>
<body>
<main class="card">
<div class="brand">Fundación ASPRODISIS</div>
<div class="badge">FRANÇAIS</div>
<h1>Charte des droits et des devoirs</h1>
<h2>Enfants</h2>
<div class="player">
<audio id="audio" controls preload="metadata" autoplay><source src="ninos-frances.mp3" type="audio/mpeg"></audio>
<button id="play">Écouter ▶</button>
</div>
<p class="note">Si l’audio ne démarre pas automatiquement, appuyez sur le bouton.</p>
<a class="home" href="index.html">← Fundación ASPRODISIS</a>
</main>
<script>
const a=document.getElementById('audio'),b=document.getElementById('play');
const label="Écouter";
b.onclick=async()=>{try{if(a.paused){await a.play();b.textContent='❚❚'}else{a.pause();b.textContent=label+' ▶'}}catch(e){}};
a.onplay=()=>b.textContent='❚❚';
a.onpause=()=>b.textContent=label+' ▶';
</script>
</body></html>
